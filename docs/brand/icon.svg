<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="PromptQuery">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1017"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#4ee07a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4ee07a" stop-opacity="0"/>
    </radialGradient>
    <filter id="markglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feFlood flood-color="#4ee07a" flood-opacity="0.75"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="500" height="500" rx="122" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="122" fill="url(#glow)"/>
  <g transform="translate(256 256) scale(1.13) translate(-256 -256)"
     filter="url(#markglow)" fill="none" stroke="#5cf08a" stroke-width="46"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 168 L246 256 L150 344"/>
    <line x1="286" y1="344" x2="384" y2="344"/>
  </g>
</svg>
