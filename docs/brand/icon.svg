<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="PromptQuery">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12141d"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4ee07a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ee07a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#tile)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="114.5" fill="none" stroke="#232634" stroke-width="3"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#glow)"/>
  <!-- prompt caret + cursor (scaled from the shipping favicon geometry) -->
  <g filter="url(#soft)" fill="none" stroke="#4ee07a" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 168 L246 256 L150 344"/>
    <line x1="286" y1="344" x2="384" y2="344"/>
  </g>
</svg>
