[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptquery"
version = "0.2.2"
description = "Natural-language SQL for production-scale Postgres schemas"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "PromptQuery contributors" }]
keywords = ["postgres", "sql", "llm", "cli", "nl2sql", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "click>=8.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "sqlglot>=23.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0", "pytest-mock>=3.0", "tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/Cyberfilo/promptquery"
Repository = "https://github.com/Cyberfilo/promptquery"
Issues = "https://github.com/Cyberfilo/promptquery/issues"

[project.scripts]
promptquery = "promptquery.cli:main"
prq = "promptquery.cli:main"
pquery = "promptquery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
